name: Publicar web

on:
  repository_dispatch:
    types: [drive-actualizado]   # lo lanza el Apps Script cuando cambia la carpeta de Drive
  workflow_dispatch:             # botón "Run workflow" para lanzarlo a mano
  push:
    branches: [main]             # y cuando cambias el código

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:                     # nunca dos publicaciones a la vez; la última espera
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # rclone se configura con variables de entorno: las credenciales nunca tocan el repo
      RCLONE_CONFIG_DRIVE_TYPE: drive
      RCLONE_CONFIG_DRIVE_SCOPE: drive
      RCLONE_CONFIG_DRIVE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar herramientas
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Leer config.json
        run: echo "RCLONE_CONFIG_DRIVE_ROOT_FOLDER_ID=$(jq -r '.drive.carpeta_id' config.json)" >> "$GITHUB_ENV"

      # Revisa la conexión con Drive y, si falla, explica en castellano qué está mal
      - name: Comprobar la conexión con Drive
        run: |
          fallo() { echo "::error title=Conexión con Drive::$1"; exit 1; }

          if [ -z "$RCLONE_CONFIG_DRIVE_SERVICE_ACCOUNT_CREDENTIALS" ]; then
            fallo "No existe el secret GDRIVE_SERVICE_ACCOUNT (o está vacío). Créalo en Settings → Secrets and variables → Actions, con ese nombre exacto."
          fi
          EMAIL=$(python3 -c 'import json,os; print(json.loads(os.environ["RCLONE_CONFIG_DRIVE_SERVICE_ACCOUNT_CREDENTIALS"])["client_email"])' 2>/dev/null) \
            || fallo "El secret GDRIVE_SERVICE_ACCOUNT no es un JSON válido. Ábrelo con el bloc de notas y pega TODO el contenido, desde la primera { hasta la última }."
          echo "Cuenta de servicio: $EMAIL"

          case "$RCLONE_CONFIG_DRIVE_ROOT_FOLDER_ID" in
            ""|null|PEGA_AQUI*|*/*|*\?*) fallo "El carpeta_id de config.json no es válido ('$RCLONE_CONFIG_DRIVE_ROOT_FOLDER_ID'). Tiene que ser solo el código que va después de /folders/ en la URL de la carpeta, sin nada más." ;;
          esac
          echo "Carpeta: $RCLONE_CONFIG_DRIVE_ROOT_FOLDER_ID"

          if ! SALIDA=$(rclone lsf drive: --max-depth 1 2>&1); then
            echo "$SALIDA"
            case "$SALIDA" in
              *accessNotConfigured*|*"has not been used"*|*SERVICE_DISABLED*)
                fallo "La Google Drive API no está habilitada en el proyecto de Google Cloud. Búscala en console.cloud.google.com y pulsa Habilitar (puede tardar unos minutos en activarse)." ;;
              *notFound*|*"not found"*|*"File not found"*)
                fallo "La cuenta de servicio no ve la carpeta. Comparte la carpeta media con $EMAIL como Editor, y comprueba que el carpeta_id es el de esa carpeta." ;;
              *invalid_grant*|*"Invalid JWT"*|*"private key"*|*PEM*)
                fallo "La clave de la cuenta de servicio no es válida (quizá se borró o se pegó cortada). Crea una clave JSON nueva y vuelve a pegarla en el secret." ;;
              *)
                fallo "No se ha podido conectar con Drive. Mira el texto de arriba para ver el error exacto." ;;
            esac
          fi
          echo "Conexión correcta. Contenido de la carpeta:"
          echo "$SALIDA"

      - name: Recuperar conversiones anteriores
        uses: actions/cache@v5
        with:
          path: .cache
          key: media-${{ github.run_id }}
          restore-keys: media-

      - name: Descargar la carpeta media de Drive
        run: |
          rclone sync drive: media \
            --drive-export-formats docx \
            --drive-skip-shortcuts \
            --exclude "/_ESTADO.txt" \
            --fast-list -v

      - name: Generar la web
        run: python build.py --media media --salida site --estado ESTADO.txt

      - name: Escribir _ESTADO.txt en Drive
        if: always()
        continue-on-error: true
        run: |
          if [ ! -s ESTADO.txt ]; then
            printf '❌ La última actualización ha fallado (%s).\nLa web sigue mostrando la versión anterior. Avisa a quien mantiene la web.\n' "$(TZ=Europe/Madrid date '+%d/%m/%Y %H:%M')" > ESTADO.txt
          fi
          rclone copyto ESTADO.txt drive:_ESTADO.txt

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
